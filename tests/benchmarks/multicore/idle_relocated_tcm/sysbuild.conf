# Enable radio loader for CPURAD
# This automatically adds the radio_loader application to the build
SB_CONFIG_NRF_RADIO_LOADER=y


SB_CONFIG_CUSTOM_RADIO=y

# MCUboot configuration
# MCUboot runs on CPUAPP and validates CPURAD image before starting it
SB_CONFIG_BOOTLOADER_MCUBOOT=y

# Use direct-XIP mode (overwrite-only, simplest approach)
SB_CONFIG_MCUBOOT_MODE_DIRECT_XIP=y

# Signature configuration (ED25519 with pure signature)
SB_CONFIG_BOOT_SIGNATURE_TYPE_ED25519=y
SB_CONFIG_BOOT_SIGNATURE_TYPE_PURE=y

# Use default test key for signing (for sample/demo purposes)
# For production, replace with your own key file
# SB_CONFIG_BOOT_SIGNATURE_KEY_FILE="bootloader/mcuboot/root-ed25519.pem"

# Reserve space for MCUboot trailer in CPURAD slots
# The merged radio_loader+remote image needs trailer space for validation
SB_CONFIG_MCUBOOT_IMAGES_ROM_END_OFFSET_AUTO="remote_rad;remote_rad_secondary_app"
# SB_CONFIG_MCUBOOT_IMAGES_ROM_END_OFFSET_AUTO="remote_rad"


# SB_CONFIG_DFU_ZIP=n
